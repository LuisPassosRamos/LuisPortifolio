name: Publicar no GitHub Pages

# Somente manual: Actions → "Publicar no GitHub Pages" → Run workflow.
# Para publicar a cada envio à main, acrescente:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a que está em andamento termina antes da próxima.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar e gerar o site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Endereço e caminho informados pelo próprio Pages: acompanham o nome
          # do repositório e um eventual domínio próprio.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
